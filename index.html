::view-transition-new(root){animation:vt .5s cubic-bezier(.4,0,.2,1)}
@keyframes vt{from{clip-path:circle(0% at 96% 4%)}to{clip-path:circle(150% at 96% 4%)}}
@media (max-width:640px){.li-card{grid-column:auto!important}}
.no-motion *{animation:none!important;transition:none!important}
.no-motion .packet{display:none}
@media (prefers-reduced-motion:reduce){.pf *{animation:none!important;transition:none!important}.pf .packet{display:none}html{scroll-behavior:auto}}
.cmenu{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:280px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 18px 50px -18px var(--shadow);display:flex;flex-direction:column;gap:2px}
.cmenu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 12px;border:0;border-radius:10px;background:transparent;color:var(--fg);font:inherit;text-align:start;text-decoration:none;cursor:pointer}
.cmenu-item:hover,.cmenu-item:focus-visible{background:var(--surface2)}
.qchip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 11px;border:1px solid var(--line-strong);border-radius:999px;background:var(--glass);color:var(--fg2);font:inherit;font-size:13.5px;font-weight:500;text-decoration:none;cursor:pointer}
.qchip:hover{border-color:var(--line-hover);color:var(--fg)}

/* Failure colour, open-source cards, merged skills cards */
.pf{--c-fault:#E5534B}.pf.theme-light{--c-fault:#CF222E}
.bar-fault{background:repeating-linear-gradient(135deg,var(--c-fault) 0 4px,color-mix(in srgb,var(--c-fault) 55%,transparent) 4px 7px)}
.pf[dir=rtl] .chip{direction:ltr;unicode-bidi:isolate}
.srow.is-fault .sname,.srow.is-fault .snum{color:var(--c-fault)!important}
.srow.is-fault.is-on{background:color-mix(in srgb,var(--c-fault) 12%,transparent)}

/* The demo keeps one height: captions and step cards are stacked in one cell, only the current one shows */
.dstack{display:grid}
.dstack>*{grid-area:1/1;visibility:hidden}
.dstack>.is-on{visibility:visible}
.step-card.is-on{animation:fadeup .35s cubic-bezier(.2,.7,.2,1)}
.drows{min-height:209px}
.codelink{color:var(--ink)}.codelink:hover{color:var(--fg)}
.ltr{direction:ltr;unicode-bidi:isolate}
.lang-btn:hover{border-color:var(--accent)}
.oimg img{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ocard:hover .oimg img{transform:scale(1.015)}
.ocard:hover .warrow{transform:translate(3px,-3px)}
.skcard{display:flex;flex-direction:column;gap:14px;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.skvis{height:150px;border-radius:12px;background:var(--well);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center}
.skcard h3{margin:4px 0 0;font-size:21px;font-weight:600}
.skcard p{margin:0;font-size:15px;line-height:1.65;color:var(--muted)}
.skchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.skchips .chip{padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--fg3);background:var(--surface2)}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr!important}.stats .disp{font-size:18px!important}}
/* Arabic: right to left */
[dir=rtl] .pf *,.pf[dir=rtl] *{letter-spacing:0!important}
.pf[dir=rtl] h1{line-height:1.2!important}
.pf[dir=rtl] .line{padding-bottom:.18em}
.pf[dir=rtl] h2,.pf[dir=rtl] h3{line-height:1.35!important}
.pf[dir=rtl] .flip{transform:scaleX(-1)}
.pf[dir=rtl] .ocard:hover .warrow.flip,.pf[dir=rtl] .wcard:hover .warrow.flip{transform:scaleX(-1) translate(3px,-3px)}
.pf[dir=rtl] .bar,.pf[dir=rtl] .progress{transform-origin:right center}
.pf[dir=rtl] .navdot{margin-right:0;margin-left:-7px}
.pf[dir=rtl] .navlink.is-active .navdot{margin-left:0}
.pf[dir=rtl] .cmenu{right:auto;left:0}
.pf[dir=rtl] .rot,.pf[dir=rtl] .rot-inner span{height:1.5em;line-height:1.5em}
.pf[dir=rtl] .rot-inner{animation-name:rot-ar}
@keyframes rot-ar{0%,18%{transform:translateY(0)}25%,43%{transform:translateY(-1.5em)}50%,68%{transform:translateY(-3em)}75%,93%{transform:translateY(-4.5em)}100%{transform:translateY(-6em)}}
@media (max-width:1060px){.nav-links .navlink{padding:8px 9px!important;font-size:13.5px!important}}
</style>

      <!-- Demo panel (glass) -->

          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-fault)"></span>
            <span class="mono" style="font-size: 12px; color: var(--dim)">{{t.demoTag}}</span>
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" class="replay mono" onClick="{{toggleAuto}}" aria-label="{{autoLabel}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted2); font-size: 12px">
              <sc-if value="{{auto}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"></rect><rect x="14" y="4" width="5" height="16" rx="1"></rect></svg>
              </sc-if>
              <sc-if value="{{notAuto}}" hint-placeholder-val="{{false}}">
                <svg class="flip" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>
              </sc-if>
              {{autoText}}
            </button>
            <button type="button" class="replay mono" onClick="{{replay}}" aria-label="{{t.replayLabel}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted2); font-size: 12px">
              <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
              {{t.replay}}
            </button>
          </div>
        </div>
        <div style="padding: 12px 18px 4px; display: flex; flex-direction: column; gap: 8px">
          <div>
            <p class="disp" style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">{{t.demoTitle}}</p>
            <p style="margin: 3px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted)">{{t.demoIntro}}</p>
          </div>
          <div role="tablist" aria-label="{{t.tabsLabel}}" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{scenarios}}" as="sc" hint-placeholder-count="4">
              <button type="button" role="tab" class="ttab {{sc.cls}}" aria-selected="{{sc.ariaSel}}" onClick="{{sc.pick}}" title="{{sc.caption}}" style="min-height: 34px; padding: 0 12px; border-radius: 8px; font: inherit; font-size: 12.5px; font-weight: 500">{{sc.label}}</button>
            </sc-for>
          </div>
          <div class="dstack">
            <sc-for list="{{scenarios}}" as="sc" hint-placeholder-count="4">
              <p class="dcap {{sc.cls}}" aria-hidden="{{sc.hidden}}" style="margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--fg2)"><span class="mono" style="font-size: 11px; color: var(--ink)">{{sc.project}} ·</span> {{sc.caption}}</p>
            </sc-for>
          </div>
        </div>
        <sc-for list="{{scenarios}}" as="sc" hint-placeholder-count="1">
          <sc-if value="{{sc.show}}" hint-placeholder-val="{{true}}">
            <div class="panel-in" style="padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 1px">
              <div class="drows" style="display: flex; flex-direction: column; gap: 1px">
              <sc-for list="{{sc.spans}}" as="sp" hint-placeholder-count="10">
                <button type="button" class="srow {{sp.cls}}" onClick="{{sp.pick}}" aria-pressed="{{sp.pressed}}">
                  <span class="sname" style="display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; color: var(--muted2)">
                    <span class="snum mono" style="flex: none; width: 18px; font-size: 10.5px; color: var(--faint)">{{sp.num}}</span>
                    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sp.plain}}</span>
                  </span>
                  <span style="position: relative; height: 16px; display: flex; align-items: center; border-inline-start: 1px solid var(--line)">
                    <span class="bar bar-{{sp.kind}}" style="display: block; margin-inline-start: {{sp.left}}; width: {{sp.width}}; animation-delay: {{sp.delay}}"></span>
                  </span>
                </button>
              </sc-for>
              </div>
              <div class="mono" style="display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 12px; padding: 2px 8px 0; font-size: 10.5px; color: var(--faint)">
                <span></span>
                <span style="display: flex; justify-content: space-between"><span>{{t.start}}</span><span>{{t.time}}</span><span>{{t.done}}</span></span>
              </div>
              <div class="dstack" style="margin: 8px 8px 0">
                <sc-for list="{{sc.cards}}" as="cd" hint-placeholder-count="10">
                <div class="step-card {{cd.cls}}" aria-hidden="{{cd.hidden}}" style="padding: 10px 14px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px">
                  <span class="mono" style="font-size: 11px; color: var(--ink)">{{t.step}} {{cd.num}} {{t.of}} {{sc.total}} · <span class="ltr" style="color: var(--dim)">{{cd.tech}}</span></span>
                  <p class="disp" style="margin: 0; font-size: 15.5px; font-weight: 600">{{cd.plain}}</p>
                  <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg2)">{{cd.desc}}</p>
                  <a href="{{cd.link}}" target="_blank" rel="noopener" class="codelink mono" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: auto; min-height: 30px; font-size: 12px; font-weight: 500; text-decoration: none"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5"></path><path d="m16 7 5 5-5 5"></path></svg>{{t.openCode}}: <span class="ltr">{{cd.file}}</span><svg class="flip" aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg></a>
                </div>
                </sc-for>
              </div>
            </div>
          </sc-if>
        </sc-for>
        <div class="mono" style="display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 9px 18px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim)">
          <span style="color: var(--muted2)">{{t.legendTitle}}</span>
          <sc-for list="{{t.legend}}" as="lg" hint-placeholder-count="6">
            <span style="display: inline-flex; align-items: center; gap: 6px"><span class="bar-{{lg.0}}" style="width: 10px; height: 4px; border-radius: 2px"></span>{{lg.1}}</span>
          </sc-for>
          <span style="margin-inline-start: auto">{{t.demoNote}}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- MARQUEE -->
  <div class="marquee" dir="ltr" aria-hidden="true" style="overflow: hidden; border-bottom: 1px solid var(--line-soft); padding: 16px 0; background: var(--bg2)">
    <div class="marquee-track">
      <sc-for list="{{marquee}}" as="m" hint-placeholder-count="12">
        <span class="disp" style="display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-size: 20px; font-weight: 500; color: var(--faint); white-space: nowrap">{{m}}<span style="width: 5px; height: 5px; border-radius: 50%; background: var(--line-hover)"></span></span>
      </sc-for>
    </div>
  </div>

  <!-- 01 EXPERIENCE -->
  <section id="experience" style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 10vw, 120px) clamp(16px, 5vw, 64px) 0">
    <p class="mono reveal" style="margin: 0 0 16px; font-size: 13px; color: var(--muted2)"><span class="ltr">{{t.expKicker}}</span></p>
    <h2 class="reveal" style="margin: 0 0 40px; font-size: clamp(30px, 4vw, 52px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600">{{t.expTitle}}</h2>
    <ol style="position: relative; list-style: none; margin: 0; padding: 0; padding-inline-start: 28px; display: flex; flex-direction: column; gap: 52px">
      <span aria-hidden="true" style="position: absolute; inset-inline-start: 0; top: 10px; bottom: 0; width: 1px; background: var(--line)"></span>
      <span class="tl-draw" aria-hidden="true" style="position: absolute; inset-inline-start: 0; top: 10px; bottom: 0; width: 1px; background: var(--accent-strong)"></span>

      <li style="position: relative">
        <span aria-hidden="true" style="position: absolute; inset-inline-start: -35px; top: 10px; width: 13px; height: 13px; border-radius: 50%; background: var(--accent-strong)"></span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; align-items: baseline">
          <h3 style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: clamp(24px, 2.4vw, 30px); font-weight: 600">{{t.rabbitRole}} · <span style="color: var(--ink)">Rabbit</span>
            <span class="mono" style="padding: 4px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warm) 55%, transparent); color: var(--warm-ink); font-size: 11.5px; font-weight: 500">{{t.current}}</span>
          </h3>
          <span class="mono" style="font-size: 13px; color: var(--muted2)">{{t.rabbitDates}}</span>
        </div>
        <p style="margin: 10px 0 0; max-width: 62ch; font-size: 16px; line-height: 1.65; color: var(--muted)">{{t.rabbitDesc}}</p>
        <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 14px">
          <sc-for list="{{rabbitGroups}}" as="g" hint-placeholder-count="3">
            <div class="card focus-card reveal" style="padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface)">
              <p class="mono" style="margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2)"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{g.color}}"></span>{{g.name}}</p>
              <ul style="margin: 0; padding: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.55; color: var(--muted)">
                <sc-for list="{{g.items}}" as="b" hint-placeholder-count="4"><li>{{b}}</li></sc-for>
              </ul>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px">
          <sc-for list="{{rabbitStack}}" as="s" hint-placeholder-count="12">
            <span class="chip mono" style="padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted2)">{{s}}</span>
          </sc-for>
        </div>
      </li>

      <li style="position: relative">
        <span aria-hidden="true" style="position: absolute; inset-inline-start: -35px; top: 10px; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line-hover); box-sizing: border-box"></span>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; align-items: baseline">
          <h3 style="margin: 0; font-size: clamp(24px, 2.4vw, 30px); font-weight: 600">{{t.numinixRole}} · <span style="color: var(--fg2)">Numinix</span></h3>
          <span class="mono" style="font-size: 13px; color: var(--muted2)">{{t.numinixDates}}</span>
        </div>
        <p style="margin: 10px 0 0; max-width: 62ch; font-size: 16px; line-height: 1.65; color: var(--muted)">{{t.numinixDesc}}</p>
        <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 14px">
          <sc-for list="{{numinixGroups}}" as="g" hint-placeholder-count="2">
            <div class="card focus-card reveal" style="padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface)">
              <p class="mono" style="margin: 0 0 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2)"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{g.color}}"></span>{{g.name}}</p>
              <ul style="margin: 0; padding: 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; line-height: 1.55; color: var(--muted)">
                <sc-for list="{{g.items}}" as="b" hint-placeholder-count="2"><li>{{b}}</li></sc-for>
              </ul>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 7px">
          <sc-for list="{{numinixStack}}" as="s" hint-placeholder-count="8">
            <span class="chip mono" style="padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--muted2)">{{s}}</span>
          </sc-for>
        </div>
      </li>

      <li style="position: relative">
        <span aria-hidden="true" style="position: absolute; inset-inline-start: -35px; top: 8px; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line-hover); box-sizing: border-box"></span>
        <h3 style="margin: 0; font-size: clamp(20px, 2vw, 24px); font-weight: 600">{{t.degree}}</h3>
        <p class="mono" style="margin: 8px 0 0; font-size: 13px; color: var(--muted2)">{{t.school}}</p>

  <!-- 02 WORK -->
  <section id="work" style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 10vw, 120px) clamp(16px, 5vw, 64px) 0">

    <h2 class="reveal" style="margin: 0 0 14px; font-size: clamp(30px, 4vw, 52px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600">{{t.workTitle}}</h2>

            <span class="mono" style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted2)"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{w.color}}"></span>{{w.tag}}</span>
            <span class="mono" style="font-size: 12px; color: var(--faint)">{{w.num}}</span>

            <sc-for list="{{w.stack}}" as="s" hint-placeholder-count="4">
              <span class="chip mono" style="padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--muted2)">{{s}}</span>
            </sc-for>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

  <!-- 03 OPEN SOURCE -->
  <section id="oss" style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 10vw, 120px) clamp(16px, 5vw, 64px) 0">
    <p class="mono reveal" style="margin: 0 0 16px; font-size: 13px; color: var(--muted2)"><span class="ltr">{{t.ossKicker}}</span></p>
    <h2 class="reveal" style="margin: 0 0 14px; font-size: clamp(30px, 4vw, 52px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600">{{t.ossTitle}}</h2>
    <p style="margin: 0 0 32px; max-width: 62ch; font-size: 17px; line-height: 1.65; color: var(--muted)">{{t.ossIntro}}</p>
    <div class="oss-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 18px">
      <sc-for list="{{oss}}" as="p" hint-placeholder-count="5">
        <article class="card lift ocard" style="display: flex; flex-direction: column; gap: 16px; padding: 18px 18px 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface)">
          <a href="{{p.link}}" target="_blank" rel="noopener" class="oimg" style="display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-soft); background: var(--well)"><img src="{{p.img}}" alt="{{p.alt}}" loading="lazy" width="960" height="380" style="display: block; width: 100%; height: auto"></a>
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
            <div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px">
              <h3 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">{{p.name}}</h3>
              <span class="disp" style="font-size: 16px; font-weight: 600; color: var(--ink)">{{p.sub}}</span>
            </div>
            <p style="margin: 2px 0 0; font-size: 15px; line-height: 1.6; color: var(--muted)">{{p.pitch}}</p>
          </div>
          <div class="stats" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 4px">
            <sc-for list="{{p.stats}}" as="st" hint-placeholder-count="3">
              <div style="padding: 10px 12px; border-radius: 10px; background: var(--well); border: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span class="disp ltr" style="font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); align-self: flex-start">{{st.num}}</span>
                <span style="font-size: 12px; line-height: 1.35; color: var(--muted2)">{{st.label}}</span>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding: 0 4px">
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{p.stack}}" as="s" hint-placeholder-count="4">
                <span class="chip mono" style="padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--muted2)">{{s}}</span>
              </sc-for>
            </div>
            <a href="{{p.link}}" target="_blank" rel="noopener" class="btn btn-ghost" style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-hover); color: var(--fg); font-size: 13.5px; font-weight: 600"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="8" r="2"></circle><path d="M6 7v10"></path><path d="M18 10c0 4-6 3-11.5 7"></path></svg>{{t.viewCode}}<svg class="warrow flip" aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg></a>
          </div>
        </article>
      </sc-for>
      <article class="card lift" style="display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 24px; border: 1px dashed var(--line-hover); border-radius: 18px; background: var(--surface)">
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px">
          <h3 style="margin: 0; font-size: 22px; font-weight: 700">{{baton.name}}</h3>
          <span class="mono" style="padding: 3px 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warm) 55%, transparent); color: var(--warm-ink); font-size: 11px">{{t.inProgress}}</span>
        </div>
        <span class="disp" style="font-size: 16px; font-weight: 600; color: var(--ink)">{{baton.sub}}</span>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted)">{{baton.pitch}}</p>
        <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{baton.stack}}" as="s" hint-placeholder-count="3">
              <span class="chip mono" style="padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--muted2)">{{s}}</span>
            </sc-for>
          </div>
          <a href="{{baton.link}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 14px; font-weight: 600; text-decoration: none">{{t.viewCode}}<svg class="warrow flip" aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg></a>
        </div>
      </article>
    </div>
  </section>

  <!-- 04 SKILLS: what I build, with the tools for each -->
  <section id="stack" style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 10vw, 120px) clamp(16px, 5vw, 64px) 0">
    <p class="mono reveal" style="margin: 0 0 16px; font-size: 13px; color: var(--muted2)"><span class="ltr">{{t.skillsKicker}}</span></p>
    <h2 class="reveal" style="margin: 0 0 14px; font-size: clamp(30px, 4vw, 52px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600; max-width: 800px">{{t.skillsTitle}}</h2>
    <p style="margin: 0 0 36px; max-width: 62ch; font-size: 17px; line-height: 1.65; color: var(--muted)">{{t.skillsIntro}}</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">

      <article class="card lift skcard">
