<style>body{background:#F6F7F9}</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="font-family:system-ui;padding:24px">Ibrahim Ahmed, Software Engineer. Email: ibrahim.ahmed.iam@gmail.com · <a href="https://linkedin.com/in/ibrahim-ahmed-ib">LinkedIn</a> · <a href="https://github.com/ibrahimahmed237">GitHub</a></p></noscript>
<template id="tpl">
<div class="pf {{motionClass}} {{themeClass}} {{paletteClass}} {{lightClass}}" style="--dk-accent: {{darkAccent}}; min-height: 100vh; overflow-x: clip">

  <!-- NAV (glass) -->
  <header style="position: sticky; top: 0; z-index: 20; padding: 0 clamp(10px, 3vw, 24px)">
    <nav class="navbar" aria-label="Main" style="position: relative; overflow: hidden; max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 10px 10px 10px 12px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 18px 18px; background: var(--header); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 var(--hl), 0 10px 40px -24px var(--shadow)">
      <a href="#top" class="brand" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--fg)">
        <span class="mark" style="position: relative; width: 44px; height: 44px; flex: none">
          <img src="assets/ibrahim.jpg" alt="" style="display: block; width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line-strong)">
        </span>
        <span style="display: flex; flex-direction: column; line-height: 1.2">
          <span class="disp" style="font-size: 17px; font-weight: 600">Ibrahim Ahmed</span>
          <span class="mono brand-sub" style="font-size: 11.5px; color: var(--dim)">Software Engineer</span>
        </span>
      </a>
      <div class="nav-links" style="display: flex; flex-wrap: nowrap; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line-soft)">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="5">
          <a class="navlink {{n.cls}}" href="{{n.href}}" aria-current="{{n.current}}" style="position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 9px; font-size: 14px; font-weight: 500"><span class="navdot" aria-hidden="true"></span>{{n.label}}</a>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <a href="#contact" class="btn btn-solid nav-cta" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; font-size: 14px">Let's talk</a>
        <button type="button" class="theme-btn" onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" title="{{themeLabel}}" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg)">
          <sc-if value="{{isDark}}" hint-placeholder-val="{{true}}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          </sc-if>
          <sc-if value="{{isLight}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
          </sc-if>
        </button>
        <button type="button" class="menu-btn theme-btn" onClick="{{toggleMenu}}" aria-label="{{menuLabel}}" aria-expanded="{{menuExpanded}}" style="align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--fg)">
          <sc-if value="{{notMenuOpen}}" hint-placeholder-val="{{true}}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
          </sc-if>
          <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
          </sc-if>
        </button>
      </div>
      <div class="mobile-menu {{menuCls}}" style="flex-basis: 100%; flex-direction: column; gap: 2px; padding: 8px 2px 4px; margin-top: 2px; border-top: 1px solid var(--line-soft)">
        <sc-for list="{{navItems}}" as="n" hint-placeholder-count="5">
          <a class="navlink {{n.cls}}" href="{{n.href}}" onClick="{{closeMenu}}" style="display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 12px; border-radius: 10px; font-size: 16px; font-weight: 500"><span class="navdot" aria-hidden="true"></span>{{n.label}}</a>
        </sc-for>
        <a href="#contact" onClick="{{closeMenu}}" class="btn btn-solid" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; font-size: 15px">Let's talk</a>
      </div>
      <span class="progress" aria-hidden="true"></span>
    </nav>
  </header>

  <!-- HERO -->
  <section id="top" style="position: relative; overflow: hidden; border-bottom: 1px solid var(--line-soft); margin-top: -66px; padding-top: 66px; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center">
    <div class="orbs" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="orb orb-c"></span>
    </div>
    <div class="gridbg" aria-hidden="true" style="position: absolute; inset: 0"></div>
    <svg aria-hidden="true" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: .35">
      <path id="p1" d="M-40 200 C 300 200, 420 440, 760 440 S 1180 240, 1500 280" fill="none" style="stroke: var(--line)" stroke-width="1"></path>
      <path id="p2" d="M-40 600 C 260 600, 520 320, 820 320 S 1240 600, 1500 560" fill="none" style="stroke: var(--line)" stroke-width="1"></path>
      <circle class="packet" r="2.5" style="fill: var(--accent-strong)"><animateMotion dur="9s" repeatCount="indefinite"><mpath href="#p1"></mpath></animateMotion></circle>
      <circle class="packet" r="2.5" style="fill: var(--c-llm)"><animateMotion dur="12s" begin="3s" repeatCount="indefinite"><mpath href="#p2"></mpath></animateMotion></circle>
    </svg>

    <div style="position: relative; width: 100%; box-sizing: border-box; max-width: 1200px; margin: 0 auto; padding: clamp(20px, 4vh, 48px) clamp(16px, 5vw, 64px) clamp(28px, 5vh, 56px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(28px, 4vw, 56px)">
      <div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 22px)">
        <div class="rise mono" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); font-size: 12.5px; color: var(--fg3)">
          <span class="pulse" style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent-strong)"></span>
          Open to new roles · relocation-ready
        </div>

        <h1 aria-label="Ibrahim Ahmed" style="margin: 0; font-size: clamp(52px, min(7.2vw, 11.5vh), 108px); line-height: .9; letter-spacing: -0.045em; font-weight: 700">
          <span class="line" aria-hidden="true"><sc-for list="{{first}}" as="c" hint-placeholder-count="7"><span class="ch" style="animation-delay: {{c.d}}">{{c.ch}}</span></sc-for></span>
          <span class="line" aria-hidden="true"><sc-for list="{{last}}" as="c" hint-placeholder-count="5"><span class="ch" style="animation-delay: {{c.d}}">{{c.ch}}</span></sc-for><span class="ch" style="animation-delay: .95s; color: var(--warm-ink)">.</span></span>
        </h1>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <span class="role disp" style="animation-delay: .9s; margin-right: 6px; font-size: 19px; font-weight: 600">Software Engineer</span>
          <sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
            <span class="role mono" style="animation-delay: {{r.d}}; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--glass); font-size: 12.5px; color: var(--fg2)"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{r.color}}"></span>{{r.label}}</span>
          </sc-for>
        </div>

        <p class="rise disp" style="animation-delay: 1.2s; margin: 2px 0 0; font-size: clamp(21px, min(2.3vw, 4vh), 32px); line-height: 1.2; letter-spacing: -0.02em; font-weight: 600; color: var(--fg2)">I build software that stays correct under <span class="rot" style="color: var(--ink)"><span class="rot-inner"><span>concurrency.</span><span>retries.</span><span>peak traffic.</span><span>partial failure.</span><span>concurrency.</span></span></span></p>
        <p class="rise" style="animation-delay: 1.3s; margin: 0; max-width: 560px; font-size: clamp(16px, 1.4vw, 18px); line-height: 1.65; color: var(--muted)">From React screens to Kafka pipelines to LLM agents: I design, test and ship the whole feature, and keep owning it in production.</p>
        <div class="rise" style="animation-delay: 1.4s; display: flex; flex-wrap: wrap; gap: 12px">
          <a href="#work" class="btn btn-solid" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 12px; background: var(--btn-bg); color: var(--btn-fg); font-weight: 600; font-size: 15px">See my work
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
          </a>
          <a href="#contact" class="btn btn-ghost" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--line-hover); background: var(--surface); color: var(--fg); font-weight: 600; font-size: 15px; box-shadow: inset 0 1px 0 var(--hl), 0 8px 22px -12px var(--shadow)">Get in touch</a>
        </div>
      </div>

      <!-- Trace panel (glass) -->
      <div class="rise" style="animation-delay: .4s; flex: 1 1 440px; min-width: 0; max-width: 580px; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 var(--hl), 0 30px 80px -30px var(--shadow); overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line)">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent-strong)"></span>
            <span class="mono" style="font-size: 12px; color: var(--dim)">live system trace</span>
          </div>
          <div style="display: flex; gap: 6px">
            <button type="button" class="replay mono" onClick="{{toggleAuto}}" aria-label="{{autoLabel}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted2); font-size: 12px">
              <sc-if value="{{auto}}" hint-placeholder-val="{{true}}">
                <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"></rect><rect x="14" y="4" width="5" height="16" rx="1"></rect></svg>
              </sc-if>
              <sc-if value="{{notAuto}}" hint-placeholder-val="{{false}}">
                <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"></path></svg>
              </sc-if>
              {{autoText}}
            </button>
            <button type="button" class="replay mono" onClick="{{replay}}" aria-label="Start this scenario again" style="display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted2); font-size: 12px">
              <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
              replay
            </button>
          </div>
        </div>
        <div style="padding: 12px 18px 4px; display: flex; flex-direction: column; gap: 8px">
          <div>
            <p class="disp" style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em">What happens behind one click</p>
            <p style="margin: 3px 0 0; font-size: 12.5px; line-height: 1.45; color: var(--muted)">Watch each step light up. Click any step to read what it does.</p>
          </div>
          <div role="tablist" aria-label="Scenarios" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{scenarios}}" as="sc" hint-placeholder-count="4">
              <button type="button" role="tab" class="ttab {{sc.cls}}" aria-selected="{{sc.ariaSel}}" onClick="{{sc.pick}}" title="{{sc.caption}}" style="min-height: 34px; padding: 0 11px; border-radius: 8px; font: inherit; font-size: 12.5px; font-weight: 500">{{sc.label}}</button>
            </sc-for>
          </div>
        </div>
        <sc-for list="{{scenarios}}" as="sc" hint-placeholder-count="1">
          <sc-if value="{{sc.show}}" hint-placeholder-val="{{true}}">
            <div class="panel-in" style="padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 1px">
              <sc-for list="{{sc.spans}}" as="sp" hint-placeholder-count="8">
                <button type="button" class="srow {{sp.cls}}" onClick="{{sp.pick}}" aria-pressed="{{sp.pressed}}">
                  <span class="sname" style="display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; color: var(--muted2)">
                    <span class="snum mono" style="flex: none; width: 18px; font-size: 10.5px; color: var(--faint)">{{sp.num}}</span>
                    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sp.plain}}</span>
                  </span>
                  <span style="position: relative; height: 16px; display: flex; align-items: center; border-left: 1px solid var(--line)">
                    <span class="bar bar-{{sp.kind}}" style="display: block; margin-left: {{sp.left}}; width: {{sp.width}}; animation-delay: {{sp.delay}}"></span>
                  </span>
                </button>
              </sc-for>
              <div class="mono" style="display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 12px; padding: 2px 8px 0; font-size: 10.5px; color: var(--faint)">
                <span></span>
                <span style="display: flex; justify-content: space-between"><span>request starts</span><span>done</span></span>
              </div>
              <div class="panel-in" style="margin: 8px 8px 0; padding: 10px 14px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 4px">
                <span class="mono" style="font-size: 11px; color: var(--ink)">Step {{sc.activeNum}} of {{sc.total}} · <span style="color: var(--dim)">{{sc.activeTech}}</span></span>
                <p class="disp" style="margin: 0; font-size: 15.5px; font-weight: 600">{{sc.activePlain}}</p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--fg2)">{{sc.activeDesc}}</p>
              </div>
            </div>
          </sc-if>
        </sc-for>
        <div class="mono" style="display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 9px 18px; border-top: 1px solid var(--line); font-size: 11px; color: var(--dim)">
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 4px; border-radius: 2px; background: var(--c-ui)"></span>screen</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 4px; border-radius: 2px; background: var(--accent-strong)"></span>server</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 4px; border-radius: 2px; background: var(--c-data)"></span>database</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 4px; border-radius: 2px; background: var(--c-queue)"></span>background job</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 10px; height: 4px; border-radius: 2px; background: var(--c-llm)"></span>AI</span>
          <span style="margin-left: auto">illustrative</span>
        </div>
      </div>
    </div>
  </section>

  <!-- MARQUEE -->
  <div class="marquee" aria-hidden="true" style="overflow: hidden; border-bottom: 1px solid var(--line-soft); padding: 16px 0; background: var(--bg2)">
    <div class="marquee-track">
      <sc-for list="{{marquee}}" as="m" hint-placeholder-count="12">
        <span class="disp" style="display: inline-flex; align-items: center; gap: 28px; padding-right: 28px; font-size: 20px; font-weight: 500; color: var(--faint); white-space: nowrap">{{m}}<span style="width: 5px; height: 5px; border-radius: 50%; background: var(--line-hover)"></span></span>
      </sc-for>
    </div>
  </div>

  <!-- 01 WORK -->
  <section id="work" style="max-width: 1200px; margin: 0 auto; padding: clamp(72px, 10vw, 120px) clamp(16px, 5vw, 64px) 0">
    <p class="mono reveal" style="margin: 0 0 16px; font-size: 13px; color: var(--muted2)">01 — GET /work</p>
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; margin: 0 0 28px">
      <h2 class="reveal" style="margin: 0; font-size: clamp(30px, 4vw, 52px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600">Selected work.</h2>
      <div role="group" aria-label="Filter work" style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{filters}}" as="fl" hint-placeholder-count="5">
          <button type="button" class="ttab {{fl.cls}}" aria-pressed="{{fl.pressed}}" onClick="{{fl.pick}}" style="min-height: 38px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 13.5px; font-weight: 500">{{fl.label}} <span class="mono" style="font-size: 11px; opacity: .7">{{fl.count}}</span></button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px">
      <sc-for list="{{works}}" as="w" hint-placeholder-count="6">
        <article class="card lift wcard" style="padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface)">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
            <span class="mono" style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted2)"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{w.color}}"></span>{{w.tag}}</span>
            <span class="mono" style="font-size: 12px; color: var(--faint)">{{w.num}}</span>
          </div>
          <h3 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">{{w.title}}</h3>
          <p style="margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted)">{{w.body}}</p>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px; border-radius: 10px; background: var(--well); border: 1px solid var(--line-soft)">
            <sc-for list="{{w.flow}}" as="f" hint-placeholder-count="4">
              <span style="display: inline-flex; align-items: center; gap: 6px">
                <span class="mono" style="padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 11.5px; color: var(--fg2)">{{f.label}}</span>
                <sc-if value="{{f.more}}" hint-placeholder-val="{{true}}">
                  <svg aria-hidden="true" width="16" height="10" viewBox="0 0 16 10"><path d="M0 5 H13" fill="none" style="stroke: var(--line-hover)"></path><path d="M10 1.5 L14 5 L10 8.5" fill="none" style="stroke: var(--line-hover)"></path></svg>
                </sc-if>
              </span>
            </sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto">
            <sc-for list="{{w.stack}}" as="s" hint-placeholder-count="5">
              <span class="chip mono" style="padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 11.5px; color: var(--muted2)">{{s}}</span>
            </sc-for>
          </div>
          <sc-if value="{{w.link}}" hint-placeholder-val="{{false}}">
            <a href="{{w.link}}" target="_blank" rel="noopener" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: 14px; font-weight: 600; text-decoration: none">View on GitHub
              <svg class="warrow" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M8 7h9v9"></path></svg>
            </a>
          </sc-if>
        </article>
      </sc-for>
    </div>
    <sc-if value="{{hasMore}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; justify-content: center; margin-top: 22px">
        <button type="button" class="btn btn-ghost" onClick="{{showAllWork}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line-hover); background: var(--surface); color: var(--fg); font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer">{{moreLabel}}
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </div>
    </sc-if>
